[metadata]
name = tccrnet
version = 0.1.0
description = Minimal PyTorch implementation of TCCR-Net for single-channel EEG denoising
license = MIT
license_files = LICENSE
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    torch>=2.0

[options.packages.find]
include = tccrnet*
